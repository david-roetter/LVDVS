name: Verify Chronicle, PeachEx contracts and company site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm test
      - run: npm run build:contracts
      - run: npm run build
